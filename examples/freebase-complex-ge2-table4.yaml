# Approximation of GE2 Table 4 settings for Freebase/ComplEx (single GPU).
# Notes:
# - GE2 uses 50 groups of size 1000 with 1000 shared negatives per group.
#   dist-kge only supports shared sampling per-batch (no group count), so this
#   config uses shared negatives per batch as the closest match.
# - GE2 uses a hybrid of RNS + DegreeNS. With partition sync, dist-kge requires
#   pooled sampling; the hybrid is not directly expressible here.
import:
- complex
- distributed_model

dataset:
  name: freebase

model: distributed_model

lookup_embedder:
  dim: 100
  sparse: true
  initialize: xavier_uniform_

complex:
  entity_embedder:
    dropout: 0.0
  relation_embedder:
    dropout: 0.0

negative_sampling:
  sampling_type: pooled
  implementation: batch
  shared: true
  shared_type: naive
  num_samples:
    s: 1000
    o: 1000

train:
  type: distributed_negative_sampling
  batch_size: 50000
  max_epochs: 10
  optimizer:
    default:
      type: dist_rowadagrad
      args:
        lr: 0.1

job:
  device_pool:
  - cuda:0
  distributed:
    num_partitions: 16
    num_workers: 1
    partition_type: glow
    glow:
      base_partition_type: stratification
    parameter_server: shared
    entity_sync_level: partition
    relation_sync_level: partition
    materialize_partition_batches: true
    stage_local_ids: true
    debug_id_bounds: false
