1vsAll:
  class_name: TrainingJob1vsAll
KvsAll:
  class_name: TrainingJobKvsAll
  label_smoothing: 0.0
  query_types:
    _po: true
    s_o: false
    sp_: true
ax_search:
  class_name: AxSearchJob
  num_sobol_trials: -1
  num_trials: 10
  parameter_constraints: []
  parameters: []
  sobol_seed: 0
complex:
  class_name: ComplEx
  entity_embedder:
    +++: +++
    dropout: 0.44299429655075073
    regularize_weight: 7.830760727899156e-12
    type: lookup_embedder
  relation_embedder:
    +++: +++
    dropout: -0.4746062345802784
    regularize_weight: 1.182876478423781e-10
    type: lookup_embedder
console:
  format: {}
  quiet: false
dataset:
  +++: +++
  files:
    +++: +++
    entity_ids:
      filename: entity_ids.del
      type: map
    entity_strings:
      filename: entity_ids.del
      type: map
    relation_ids:
      filename: relation_ids.del
      type: map
    relation_strings:
      filename: relation_ids.del
      type: map
    test:
      filename: test.del
      type: triples
    train:
      filename: train.del
      type: triples
    valid:
      filename: valid.del
      type: triples
  name: wikidata5m
  num_entities: -1
  num_relations: -1
  pickle: true
distributed_model:
  base_model:
    +++: +++
    type: complex
  class_name: DistributedModel
  create_eval: false
distributed_negative_sampling:
  class_name: TrainingJobNegativeSamplingDistributed
entity_ranking:
  chunk_size: 25000
  class_name: EntityRankingJob
  filter_splits:
  - train
  - valid
  filter_with_test: true
  hits_at_k_s:
  - 1
  - 3
  - 10
  - 50
  - 100
  - 200
  - 300
  - 400
  - 500
  - 1000
  labels_on_cpu: false
  metrics_per:
    argument_frequency: false
    head_and_tail: false
    relation_type: false
  rank_against: -1
  rank_against_options:
    combined: false
    combined_options:
      sampling_type: frequency
    sampling_type: uniform
  tie_handling: rounded_mean_rank
eval:
  batch_size: 200
  num_workers: 0
  pin_memory: false
  split: valid
  trace_level: epoch
  type: entity_ranking
grid_search:
  class_name: GridSearchJob
  parameters:
    +++: +++
  run: true
import:
- distributed_model
- complex
job:
  device: cuda
  device_pool:
  - cuda:0
  - cuda:1
  distributed:
    already_init_workers: -1
    entity_async_write_back: true
    entity_localize: false
    entity_pre_pull: 0
    entity_sync_level: partition
    gloo_socket_ifname: lo
    lapse_port: 9091
    machine_id: 0
    master_ip: 127.0.0.1
    master_port: 8888
    num_eval_workers: 1
    num_machines: 1
    num_partitions: 8
    num_threads_per_process: 2
    num_workers: 4
    num_workers_machine: 4
    parameter_server: shared
    partition_type: stratification
    pre_localize_batch: false
    pre_localize_partition: false
    relation_async_write_back: true
    relation_localize: false
    relation_pre_pull: 0
    relation_sync_level: batch
    repartition_epoch: true
    scheduler_data_type: int32
    stratification:
      active_only: true
      combine_mirror: true
  type: train
lookup_embedder:
  class_name: LookupEmbedder
  dim: 128
  dropout: 0.0
  initialize: normal_
  initialize_args:
    +++: +++
    normal_:
      mean: 0.0
      std: 5.8970567449527816e-05
    uniform_:
      a: -0.6644901805979013
    xavier_normal_:
      gain: 1.0
    xavier_uniform_:
      gain: 1.0
  normalize:
    p: -1.0
  pretrain:
    ensure_all: false
    model_filename: ''
  regularize: lp
  regularize_args:
    +++: +++
    p: 1
    weighted: true
  regularize_weight: 0.0
  round_dim_to: []
  sparse: true
manual_search:
  class_name: ManualSearchJob
  configurations: []
  run: true
model: distributed_model
modules:
- kge.model.embedder
- kge.model
- kge.job
negative_sampling:
  class_name: TrainingJobNegativeSampling
  combined: false
  combined_options:
    negatives_percentage: 0.5
    sampling_type: batch
    shared_type: naive
    with_replacement: true
  filtering:
    implementation: fast_if_available
    o: false
    p: false
    s: false
    split: ''
  frequency:
    smoothing: 1
  implementation: batch
  num_samples:
    o: 7851
    p: 0
    s: 2176
  sampling_type: pooled
  shared: true
  shared_type: naive
  with_replacement: true
random_seed:
  default: -1
  numba: -1
  numpy: -1
  python: -1
  torch: -1
search:
  device_pool: []
  num_workers: 1
  on_error: abort
  type: ax_search
train:
  abort_on_nan: true
  auto_correct: true
  batch_size: 1024
  checkpoint:
    every: 3
    keep: 3
    keep_init: true
  loss: kl
  loss_arg: 1.0
  lr_scheduler: ReduceLROnPlateau
  lr_scheduler_args:
    +++: +++
    factor: 0.95
    mode: max
    patience: 1
    threshold: 0.0001
  lr_warmup: 0
  max_epochs: 2
  num_workers: 4
  optimizer:
    +++: +++
    default:
      args:
        +++: +++
        lr: 0.6560544891789137
      type: dist_adagrad
    entity:
      args:
        +++: +++
      regex: .*_entity_embedder.*
    relation:
      args:
        +++: +++
      regex: .*_relation_embedder.*
  pin_memory: false
  split: train
  subbatch_auto_tune: false
  subbatch_size: -1
  trace_level: epoch
  type: distributed_negative_sampling
  visualize_graph: false
training_loss:
  class_name: TrainingLossEvaluationJob
user:
  +++: +++
valid:
  early_stopping:
    patience: 10
    threshold:
      epochs: 2
      metric_value: 0.1
  every: 0
  metric: mean_reciprocal_rank_filtered_with_test
  metric_expr: float("nan")
  metric_max: true
  split: valid
  trace_level: epoch
