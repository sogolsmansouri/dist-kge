  num_workers: 2
  on_error: abort
  type: ax_search
train:
  abort_on_nan: true
  auto_correct: true
  batch_size: 1024
  checkpoint:
    every: 5
    keep: 3
    keep_init: true
  loss: kl
  loss_arg: .nan
  lr_scheduler: ReduceLROnPlateau
  lr_scheduler_args:
    +++: +++
    factor: 0.95
    mode: max
    patience: 9
    threshold: 0.0001
  lr_warmup: 0
  max_epochs: 400
  num_workers: 4
  optimizer:
    +++: +++
    default:
      args:
        +++: +++
        lr: 0.16755594652229405
      type: Adagrad
    entity:
