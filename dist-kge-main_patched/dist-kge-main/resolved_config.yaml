        +++: +++
      regex: .*_entity_embedder.*
    relation:
      args:
        +++: +++
      regex: .*_relation_embedder.*
  pin_memory: false
  split: train
  subbatch_auto_tune: false
  subbatch_size: -1
  trace_level: epoch
  type: negative_sampling
  visualize_graph: false
