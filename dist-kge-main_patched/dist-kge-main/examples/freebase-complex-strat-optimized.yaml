complex:
  entity_embedder:
    dropout: -0.4202541569247842
    regularize_weight: 0.0016039710378808378
  relation_embedder:
    dropout: -0.4545119274407625
    regularize_weight: 9.709504921691681e-20
dataset:
  name: freebase
eval:
  batch_size: 2048
  trace_level: epoch
import:
- complex
- distributed_model
job:
  device_pool:
  - cuda:0
  - cuda:1
  - cuda:2
  distributed:
    num_partitions: 32
    num_workers: 3
    partition_type: stratification
    parameter_server: shared
    entity_sync_level: partition
    relation_sync_level: partition
    shuffle_partition_samples: false
    materialize_partition_batches: true
    stage_local_ids: true
    debug_id_bounds: true
    hot_entity_cache:
      enable: true
      max_entities: 512
    scheduler_feedback:
      enable: true
      min_history: 3
      slow_partition_factor: 1.5
      target_chunk_size: 40000
      min_chunk_size: 8000
      max_splits_per_partition: 8
    glow:
      base_partition_type: stratification
lookup_embedder:
  dim: 128
  initialize: xavier_uniform_
  initialize_args:
    normal_:
      mean: 0.0
      std: 0.7247714657764338
    uniform_:
      a: -0.7264893817037996
    xavier_normal_:
      gain: 1.0
    xavier_uniform_:
      gain: 1.0
  regularize_args:
    weighted: true
  sparse: true
model: distributed_model
negative_sampling:
  sampling_type: pooled
  implementation: batch
  num_samples:
    o: 200
    s: 96
  shared: true
  shared_type: naive
train:
  auto_correct: true
  batch_size: 2048
  loss_arg: .nan
  lr_scheduler: ReduceLROnPlateau
  lr_scheduler_args:
    factor: 0.95
    mode: max
    patience: 9
    threshold: 0.0001
  max_epochs: 10
  num_workers: 4
  optimizer:
    default:
      args:
        lr: 0.16755594652229405
      type: dist_rowadagrad
  type: distributed_negative_sampling
valid:
  every: 5
  early_stopping:
    patience: 10
    threshold:
      epochs: 50
      metric_value: 0.05
