import: [lookup_embedder]

nary_tucker:
  class_name: kge.model.nary_tucker.NaryTuckerModel
  entity_embedder:
    type: lookup_embedder
    dim: 200
  relation_embedder:
    type: lookup_embedder
    dim: 200
  rank: 200
  dropout: 0.2
  # Fallback max arity if dataset metadata is not available during initialization.
  max_supported_arity: 4
